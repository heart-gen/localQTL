[tool.poetry]
name = "localqtl"
version = "0.0.0" # placeholder, replaced dynamically
description = "GPU-accelerated ancestry-aware cis-QTL mapping library with tensorQTL-compatible APIs"
authors = ["Kynon J Benjamin <kj.benjamin90@gmail.com>"]
maintainers = ["Kynon J Benjamin <kj.benjamin90@gmail.com>"]
readme = "README.md"
license = "GPL-3.0-or-later"
packages = [{include = "localqtl", from = "src"}]
keywords = [
    "genomics", "gpu", "xQTL", "qtl"
]

[tool.poetry.dependencies]
python = ">=3.11,<3.15"
torch = "^2.8"
numpy = "^2.0"
scipy = "^1.16"
pandas = "^2.2"
pgenlib = "^0.93"
rfmix-reader = ">=0.7.3"
py-qvalue = "^0.1"
pyarrow = ">=22,<24"
pandas-plink-ng = "^2.3.2.post1"
# GPU backends are optional: the array / dataframe helpers fall back to numpy
# and pandas when CuPy / cuDF are absent or fail to initialise.
cupy-cuda12x = { version = "^13.6", optional = true }
cudf-cu12 = { version = "^25.10", optional = true }
dask-cudf-cu12 = { version = "^25.10.0", optional = true }
# tabix access to gnomAD / ALFA sites VCFs (localqtl.freq importers); the
# bcftools-query TSV reader works without it.
pysam = { version = ">=0.22", optional = true }
# REST access to the IGVF Catalog (localqtl.annotate.igvf); the cached-table
# and BEDPE readers work without it.  The AlphaGenome SDK is *not* locked
# here: it is licensed for non-commercial use and pulls grpcio / anndata, so
# install it separately with `pip install alphagenome` for live Atlas queries
# (localqtl.annotate.alphagenome reads exported score tables without it).
requests = { version = ">=2.31", optional = true }

[tool.poetry.scripts]
localqtl = "localqtl.cli:main"

[tool.poetry.extras]
gpu = ["cupy-cuda12x", "cudf-cu12", "dask-cudf-cu12"]
annotate = ["pysam"]
annotate-live = ["pysam", "requests"]

[tool.poetry.urls]
homepage = "https://localqtl.readthedocs.io/en/latest/"
repository = "https://github.com/heart-gen/localQTL"
"Bug Tracker" = "https://github.com/heart-gen/localQTL/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "live: tests that call external APIs (run with --run-live)",
]

[tool.poetry-dynamic-versioning]
enable = true
style = "pep440"
dirty = true

[build-system]
requires = [
    "poetry-core>=2.0.0,<3.0.0",
    "poetry-dynamic-versioning[plugin]"
]
build-backend = "poetry_dynamic_versioning.backend"

[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)",
    "ruff (>=0.14.2,<0.15.0)",
    "black (>=26.3.1,<27.0.0)",
    "mypy (>=1.18.2,<2.0.0)",
    "pytest-cov (>=7.0.0,<8.0.0)",
    "pytest-xdist (>=3.8.0,<4.0.0)",
    "pysam (>=0.22)"
]
docs = [
    "sphinx (>=8,<9)",
    "furo (>=2025.9.25,<2026.0.0)",
    "sphinx-autodoc-typehints (>=3.5.2,<4.0.0)",
    "numpydoc (>=1.9.0,<2.0.0)",
    "sphinx-copybutton (>=0.5.2,<0.6.0)",
    "sphinx-design (>=0.6.1,<0.7.0)",
    "sphinx-rtd-theme (>=3.0.2,<4.0.0)"
]
